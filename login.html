<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <title>Ingresar — Crimson Veil</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link
    rel="stylesheet"
    href="css/styles.css"
  >

  <link
    rel="stylesheet"
    href="css/auth.css"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >
</head>


<body class="auth-page">

  <!-- NAV -->
  <nav class="site-nav">

    <a href="index.html" class="brand">

      <div class="nav-logo-wrap">

        <img
          src="img/crimson-veil-logo.jpeg"
          alt="Crimson Veil"
          class="nav-logo"
        >

      </div>

      <div class="brand-copy">

        <strong>
          Crimson Veil
        </strong>

        <small>
          Team Hub
        </small>

      </div>

    </a>


    <div class="menu">

      <a href="index.html">

        <i class="fa-solid fa-house"></i>

        <span>
          Inicio
        </span>

      </a>

    </div>

  </nav>


  <!-- AUTH -->
  <main class="auth-main">

    <div class="auth-stars"></div>

    <span class="auth-floating star-one">
      ✦
    </span>

    <span class="auth-floating star-two">
      ✧
    </span>

    <span class="auth-floating moon-one">
      ☾
    </span>


    <section class="auth-card">

      <!-- HEADER -->
      <header class="auth-header">

        <p class="eyebrow">
          PLAYER ACCESS
        </p>

        <h1>
          Enter the
          <em>Veil.</em>
        </h1>

        <p>
          Iniciá sesión o creá tu cuenta para acceder
          a tu perfil dentro de Crimson Veil.
        </p>

      </header>


      <!-- TABS -->
      <div class="auth-tabs">

        <button
          type="button"
          class="auth-tab active"
          data-tab="login"
        >
          Iniciar sesión
        </button>

        <button
          type="button"
          class="auth-tab"
          data-tab="register"
        >
          Crear cuenta
        </button>

      </div>


      <!-- =========================
           LOGIN
      ========================== -->

      <form
        id="loginForm"
        class="auth-form active"
      >

        <div class="form-group">

          <label for="loginEmail">
            Email
          </label>

          <input
            id="loginEmail"
            type="email"
            placeholder="tu@email.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="loginPassword">
            Contraseña
          </label>

          <div class="password-field">

            <input
              id="loginPassword"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              aria-label="Mostrar contraseña"
            >
              <i class="fa-regular fa-eye"></i>
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="btn btn-primary auth-submit"
        >

          <i class="fa-solid fa-right-to-bracket"></i>

          Ingresar

        </button>


        <button
          id="forgotPassword"
          type="button"
          class="forgot-button"
        >
          ¿Olvidaste tu contraseña?
        </button>

      </form>


      <!-- =========================
           REGISTRO
      ========================== -->

      <form
        id="registerForm"
        class="auth-form"
      >

        <div class="form-row">

          <div class="form-group">

            <label for="registerNickname">
              Nickname
            </label>

            <input
              id="registerNickname"
              type="text"
              maxlength="25"
              placeholder="QueenStranger"
              required
            >

          </div>


          <div class="form-group">

            <label for="registerRole">
              Rol
            </label>

            <select
              id="registerRole"
              required
            >

              <option value="">
                Elegí tu rol
              </option>

              <option value="top">
                Top
              </option>

              <option value="jungle">
                Jungle
              </option>

              <option value="mid">
                Mid
              </option>

              <option value="adc">
                ADC
              </option>

              <option value="support">
                Support
              </option>

            </select>

          </div>

        </div>


        <div class="form-group">

          <label for="registerEmail">
            Email
          </label>

          <input
            id="registerEmail"
            type="email"
            placeholder="tu@email.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="registerPassword">
            Contraseña
          </label>

          <div class="password-field">

            <input
              id="registerPassword"
              type="password"
              minlength="6"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              aria-label="Mostrar contraseña"
            >
              <i class="fa-regular fa-eye"></i>
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="btn btn-primary auth-submit"
        >

          <i class="fa-solid fa-user-plus"></i>

          Crear cuenta

        </button>


        <p class="register-note">
          Después vas a poder personalizar tu perfil.
        </p>

      </form>


      <!-- MESSAGE -->
      <div
        id="authMessage"
        class="auth-message"
      ></div>

    </section>

  </main>


  <script
    type="module"
    src="js/auth.js"
  ></script>

</body>

</html>
